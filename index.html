<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#127c7a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiColour"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>BiColour Quotes &amp; Invoices</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one question per screen, big type and big buttons, for a busy tradie who wants it simple. Turquoise & Burnt Melon. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --sunk:#f7faf9; --ink:#15302f; --muted:#506461; --line:#d3e0dd;
  --teal:#127c7a; --teal-ink:#ffffff; --teal-soft:#dff0ee; --melon:#ee8547; --melon-ink:#a8501d; --melon-soft:#fde9dc;
  --good:#2e7d4f; --good-soft:#e0f2e7; --bad:#b3362c; --bad-soft:#f8e0dd;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1918; --surface:#172423; --sunk:#132020; --ink:#e6f0ee; --muted:#9ab0ac; --line:#28403e;
  --teal:#4cb8b3; --teal-ink:#08201f; --teal-soft:#183a38; --melon:#f09a62; --melon-ink:#f5b48a; --melon-soft:#3a2617;
  --good:#6cc391; --good-soft:#18342a; --bad:#ec7b70; --bad-soft:#3d1f1c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1918; --surface:#172423; --sunk:#132020; --ink:#e6f0ee; --muted:#9ab0ac; --line:#28403e;
  --teal:#4cb8b3; --teal-ink:#08201f; --teal-soft:#183a38; --melon:#f09a62; --melon-ink:#f5b48a; --melon-soft:#3a2617;
  --good:#6cc391; --good-soft:#18342a; --bad:#ec7b70; --bad-soft:#3d1f1c; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:0 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--melon);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;padding:14px 0;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:44px;height:44px}
.brand b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand b span{color:var(--melon-ink)}
.link{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:10px 6px;font-size:17px}
.link:hover{text-decoration:underline}

.big{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 10px}
@media (max-width:480px){.big{grid-template-columns:1fr}}
.bigbtn{border:0;border-radius:16px;padding:26px 20px;cursor:pointer;text-align:left;display:grid;gap:4px;min-height:120px;align-content:end}
.bigbtn b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.bigbtn span{font-size:16px;opacity:.9}
.bigbtn.q{background:var(--teal);color:var(--teal-ink)}
.bigbtn.i{background:var(--melon);color:#2a1406}
.bigbtn:hover{filter:brightness(1.05)}
.small-actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:22px}

.section-title{font-family:var(--display);font-size:20px;font-weight:700;margin:6px 0 10px}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--teal)}
.row .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .what{font-size:15px;color:var(--muted);grid-column:1}
.row .amt{font-weight:700;text-align:right}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;justify-self:end}
.pill.quote{background:var(--teal-soft);color:var(--teal)}
.pill.unpaid{background:var(--melon-soft);color:var(--melon-ink)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}

/* wizard */
.progress{display:flex;gap:6px;margin:6px 0 22px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--teal)}
.kicker{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--melon-ink);margin-bottom:6px}
.q-title{font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.01em;line-height:1.1;margin-bottom:8px}
.hint{color:var(--muted);margin:0 0 18px;font-size:17px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:17px}
.bigin{width:100%;font-size:24px;padding:16px 18px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.bigin:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px var(--teal-soft)}
textarea.bigin{min-height:110px;resize:vertical;font-size:21px;line-height:1.35}
.money{position:relative}
.money span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--muted);pointer-events:none}
.money .bigin{padding-left:40px}
.sugg{display:grid;gap:6px;margin-top:6px}
.sugg-h{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sugg button{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;display:grid;gap:2px}
.sugg button:hover,.sugg button:focus-visible{border-color:var(--teal)}
.sugg b{font-size:19px}
.sugg span{font-size:15px;color:var(--muted);white-space:pre-line}
.nav{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 22px;font-size:20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.next{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);flex:1;min-width:180px}
.btn.melon{background:var(--melon);border-color:var(--melon);color:#2a1406}
.btn.skip{color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:22px;height:22px}

.jobs{display:grid;gap:8px;margin-bottom:16px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.job .d{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.job .p{font-weight:700}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:40px;height:40px;border-radius:10px;font-size:22px;line-height:1}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-radius:12px;background:var(--teal-soft);margin-bottom:10px}
.totalbar b{font-family:var(--display);font-size:30px}
.addjob{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:4px}
.choice{display:grid;gap:10px;margin-bottom:12px}
.choice button{text-align:left}

/* review */
.done-head{display:grid;gap:4px;margin-bottom:16px}
.done-total{font-family:var(--display);font-size:clamp(40px,10vw,56px);font-weight:800;line-height:1;letter-spacing:-.02em}
.actions{display:grid;gap:10px;margin:14px 0 18px}
.actions .btn{width:100%;justify-content:flex-start;padding:18px 20px}
.actions .btn small{font-weight:500;font-size:15px;color:inherit;opacity:.8;margin-left:auto}
.edits{display:flex;gap:4px 14px;flex-wrap:wrap;margin-bottom:16px}
.banner{background:var(--melon-soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:17px}
.paper{overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(15,50,48,.14);margin-top:8px}
.paper .sheet{width:794px;min-height:1123px;display:flex;flex-direction:column}
.paper .sh-body{flex:1}
.paper-label{font-size:15px;color:var(--muted);margin-top:18px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* settings */
.set{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.set h2{font-size:20px}
.set input,.set textarea{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--sunk)}
.set .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.set .two{grid-template-columns:1fr}}
.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ic{background:var(--sunk);border:2px solid var(--line);border-radius:12px;padding:12px 6px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:14px;font-weight:600}
.ic svg{width:52px;height:52px}
.ic.on{border-color:var(--teal);background:var(--teal-soft)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--teal)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:12px;font-weight:600;font-size:17px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.drop{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;padding:16px}
.drop div{border:3px dashed var(--melon);background:var(--surface);border-radius:16px;padding:40px 28px;font-family:var(--display);font-size:22px;font-weight:700;text-align:center;max-width:520px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--melon);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.foot-note{text-align:center;color:var(--muted);font-size:14px;margin-top:30px}
@media (prefers-reduced-motion:no-preference){.screen{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}}
</style>
<style id="doc-css"></style>

<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Home"><span id="topMark"></span><b>Bi<span>Colour</span></b></button>
    <button class="link" data-act="home" id="homeLink" hidden>Home</button>
  </header>
  <main id="app"></main>
  <p class="foot-note" id="storeNote">Loading your jobs…</p>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/pdf,image/*" hidden>
<div class="drop" id="drop" hidden><div>Drop the invoice or builder's order here</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ICONS = {
  roller: (a,b,k) => `<path d="M22 14h22v28H22a9 9 0 0 1-9-9V23a9 9 0 0 1 9-9z" fill="${a}"/><path d="M44 14h26a9 9 0 0 1 9 9v10a9 9 0 0 1-9 9H44z" fill="${b}"/><path d="M79 28h8v22H50v12" fill="none" stroke="${k}" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="43" y="61" width="14" height="30" rx="6" fill="${k}"/>`,
  house: (a,b,k) => `<path d="M12 50 50 18l38 32" fill="none" stroke="${a}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 48v34h52V48" fill="none" stroke="${k}" stroke-width="7" stroke-linejoin="round"/><path d="M8 72c24-11 52-13 84-6" fill="none" stroke="${b}" stroke-width="11" stroke-linecap="round"/>`,
  brush: (a,b,k) => `<g transform="rotate(35 50 50)"><rect x="43" y="2" width="14" height="38" rx="7" fill="${k}"/><rect x="35" y="38" width="30" height="15" rx="3" fill="${k}" opacity=".55"/><path d="M35 53h15v32c-8 0-15-5-15-14z" fill="${a}"/><path d="M50 53h15v18c0 9-7 14-15 14z" fill="${b}"/></g>`,
  drip: (a,b,k,id) => `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset=".5" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/></linearGradient></defs><text x="50" y="80" text-anchor="middle" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-weight="800" font-size="92" fill="url(#${id})">B</text><path d="M58 76v12a5 5 0 0 0 10 0V74z" fill="${b}"/>`,
  can: (a,b,k) => `<path d="M24 36c0-24 52-24 52 0" fill="none" stroke="${k}" stroke-width="4.5"/><rect x="20" y="34" width="60" height="54" rx="7" fill="${a}"/><rect x="20" y="30" width="60" height="12" rx="5" fill="${b}"/><path d="M34 40v18a6 6 0 0 0 12 0V40zM56 40v9a5 5 0 0 0 10 0v-9z" fill="${b}"/>`,
  chips: (a,b,k) => `<rect x="8" y="22" width="52" height="52" rx="8" fill="${a}" transform="rotate(-8 34 48)"/><rect x="40" y="18" width="52" height="52" rx="8" fill="${b}" transform="rotate(7 66 44)"/>`
};
const ICON_NAMES = { roller:'Paint roller', house:'House & stroke', brush:'Paint brush', drip:'Dripping B', can:'Paint tin', chips:'Paint chips' };
let markN = 0;
const MARK = (a, b, k='#15302f', name) => `<svg viewBox="0 0 100 100" aria-hidden="true">${(ICONS[name || (typeof S!=='undefined' && S.icon) || 'roller'] || ICONS.roller)(a,b,k,'mk'+(++markN))}</svg>`;
function paintTopMark(){ document.getElementById('topMark').innerHTML = MARK('#127c7a', '#ee8547', 'var(--ink)'); }
const DOC_CSS = `
.sheet{background:#fff;color:#15302f;font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.5;min-width:520px;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-band{background:#127c7a;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 32px;border-bottom:6px solid #ee8547}
.sh-logo{display:flex;align-items:center;gap:12px;color:#fff}
.sh-logo svg{width:62px;height:62px}
.sh-logo b{display:block;font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.01em}
.sh-logo b span{color:#ffb98c}
.sh-logo small{display:block;font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;margin-top:5px;opacity:.95}
.sh-title{text-align:right;color:#fff}
.sh-title h2{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-size:28px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.sh-title div{font-size:13px;margin-top:6px}
.sh-body{padding:22px 32px 26px}
.sh-biz{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;color:#506461;padding-bottom:14px;border-bottom:1px solid #dbe7e4}
.sh-biz b{color:#15302f;font-size:12.5px;display:block}
.sh-biz .r{text-align:right}
.sh-parties{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;margin:18px 0 22px}
.sh-lab{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b4521c;margin-bottom:4px}
.sh-parties b{display:block;font-size:14px}
.sh-parties div div{white-space:pre-line}
.sh-dates{width:100%;border-collapse:collapse}
.sh-dates td{padding:1px 0;font-size:12px}
.sh-dates td:first-child{color:#506461}
.sh-dates td:last-child{text-align:right;font-weight:600}
.sh-items{width:100%;border-collapse:collapse}
.sh-items th{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#127c7a;text-align:left;padding:8px 10px}
.sh-items td{padding:11px 10px;border-bottom:1px solid #dbe7e4;vertical-align:top;white-space:pre-line}
.sh-items .r{text-align:right;white-space:nowrap}
.sh-empty{color:#8aa09c;font-style:italic}
.sh-tot{margin:16px 0 0 auto;width:300px;border-collapse:collapse}
.sh-tot td{padding:4px 10px}
.sh-tot td:first-child{white-space:nowrap}
.sh-tot td:last-child{text-align:right}
.sh-tot .g td{border-top:1px solid #c9e4df;padding-top:8px;font-weight:600;font-size:13px}
.sh-tot .paid td{color:#2e7d4f}
.sh-tot .bal td{background:#fdeee3;color:#b4521c;font-weight:600;padding:7px 10px;font-size:13px}
.sh-notes{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}
.sh-notes div div{white-space:pre-line;font-size:12px}
.sh-due{margin-top:10px;background:#fdeee3;border:1px solid #f6d3bb;color:#b4521c;border-radius:6px;padding:7px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh-due span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sh-due b{font-size:14px;font-weight:600}
.sh-q{font-size:12px;color:#506461;margin:28px 0 0;padding-top:14px;border-top:1px solid #dbe7e4;text-align:center}
.sh-q b{color:#127c7a}
.sh-pay{background:#e7f4f1;border:1px solid #c9e4df;border-radius:6px;padding:10px 12px}
.sh-foot{margin-top:26px;padding:12px 32px;background:#127c7a;color:#e6f4f2;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh-foot b{color:#fff;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
`;
document.getElementById('doc-css').textContent = DOC_CSS;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(n)||0);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) : '—';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o));
const UNITS = ['each','room','m²','lm','hr','coat','lot'];
const ICON = {
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',

const LS = 'bicolour.v1';
const store = {
  mode:'local', col:null,
  async init(){
    try{
      const c = await waitForClaude();
      if (c){
        const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
        if (db && user){
          const id = await user.id();
          if (id){ this.col = db.collection('data/users/' + id); this.mode = 'db'; }
        }
      }
    }catch(e){ this.mode = 'local'; }
    return this.load();
  },
  readLocal(){ try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; } },
  writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify({settings:S, docs:DOCS})); }catch(e){} },
  async load(){
    if (this.mode === 'db'){
      try{
        const snap = await this.col.get();
        let settings = null; const docs = [];
        snap.docs.forEach(s => { const v = s.data(); if (!v) return; if (v.type==='settings') settings = v; else if (v.type==='doc') docs.push(clone(v)); });
        if (!settings && !docs.length){
          const local = this.readLocal();
          if (local && (local.docs?.length || local.settings)){ // carry over anything saved in this browser
            settings = local.settings; local.docs?.forEach(d => docs.push(d));
            if (settings) await this.col.doc('settings').set(settings);
            for (const d of docs) await this.col.doc(d.id).set(d);
          }
        }
        return { settings, docs };
      }catch(e){ this.mode = 'local'; }
    }
    const local = this.readLocal();
    return { settings: local?.settings || null, docs: local?.docs || [] };
  },
  async saveDoc(d){ this.writeLocal(); if (this.mode==='db') await this.col.doc(d.id).set(clone(d)); },
  async deleteDoc(id){ this.writeLocal(); if (this.mode==='db') await this.col.doc(id).delete(); },
  async saveSettings(){ this.writeLocal(); if (this.mode==='db') await this.col.doc('settings').set(clone(S)); }
};
function waitForClaude(){
  return new Promise(res => {
    if (window.claude?.use) return res(window.claude);
    let n = 0; const t = setInterval(() => { if (window.claude?.use){ clearInterval(t); res(window.claude); } else if (++n > 1){ clearInterval(t); res(null); } }, 100);
  });
}

  document.body.appendChild(holder);
  try{
    try{ await document.fonts.ready; }catch(e){}
    await Promise.all([...holder.querySelectorAll('img')].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
    const canvas = await html2canvas(sheet, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false });
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const pageW = 210, pageH = 297, imgH = canvas.height * pageW / canvas.width;
    const img = canvas.toDataURL('image/jpeg', 0.92);
    let y = 0;
    pdf.addImage(img, 'JPEG', 0, 0, pageW, imgH);
    while (imgH - (y += pageH) > 1){ pdf.addPage(); pdf.addImage(img, 'JPEG', 0, -y, pageW, imgH); }
    pdf.setProperties({ title: `${docTitle(d)} – ${S.business.name}`, author: S.business.name });
    return pdf.output('arraybuffer');
  } finally { holder.remove(); }
}

async function pdfToInput(file){
  const lib = window.pdfjsLib; if (!lib) throw {code:'pdf_lib'};
  try{ if (!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false }).promise;
  let text = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 4); i++){
    const page = await pdf.getPage(i); const tc = await page.getTextContent();
    text += tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
  }
  text = text.replace(/[ \t]+/g,' ').trim();
  if (text.length > 60) return { text: text.slice(0, 20000), images: [] };
  // scanned PDF: send page 1 as a picture
  const page = await pdf.getPage(1); const vp = page.getViewport({ scale: 2 });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  return { text: '', images: [blob] };
}

/* ---------- maths: new jobs are typed INCLUDING GST ---------- */
function lineTotal(d, i){ return d.inc ? round2(num(i.qty || 1) * num(i.price)) : round2(num(i.qty) * num(i.rate)); }
function calc(d){
  const paid = d.kind==='invoice' ? round2(num(d.paid)) : 0;
  if (d.inc){
    const total = round2(d.items.reduce((a,i) => a + lineTotal(d,i), 0));
    const gst = (S.gst && d.applyGst) ? round2(total / 11) : 0;
    const sub = round2(total - gst);
    return { sub, discount:0, net:sub, gst, total, paid, balance: round2(total - paid) };
  }
  const sub = round2(d.items.reduce((a,i) => a + lineTotal(d,i), 0));
  const discount = round2(Math.min(num(d.discount), sub));
  const net = round2(sub - discount);
  const gst = (S.gst && d.applyGst) ? round2(net * 0.10) : 0;
  const total = round2(net + gst);
  return { sub, discount, net, gst, total, paid, balance: round2(total - paid) };
}
function toIncMode(d){
  if (d.inc) return d;
  const f = (S.gst && d.applyGst) ? 1.1 : 1;
  d.items = d.items.map(i => {
    const extra = (num(i.qty) !== 1 && !/@/.test(i.desc||'')) ? ` (${num(i.qty)} ${i.unit} @ ${money(i.rate)}${f>1?' + GST':''})` : '';
    return { id:i.id||uid(), desc:(i.desc||'') + extra, qty:1, price: round2(num(i.qty)*num(i.rate)*f) };
  });
  if (num(d.discount)){ d.items.push({ id:uid(), desc:'Discount', qty:1, price: -round2(num(d.discount)*f) }); d.discount = 0; }
  d.inc = true; return d;
}

function nextNumber(kind){ return String(kind==='quote' ? S.nextQuote : S.nextInvoice); }
function payRef(d){ return (d.customer.name||'').replace(/\(.*?\)/g,'').trim() || (d.site||'').split(',')[0].trim() || 'Your name'; }
function shownNumber(d){ return d.number || nextNumber(d.kind); }
function payState(d){
  if (d.kind==='quote') return d.status==='Accepted' ? ['quote','Accepted'] : ['quote','Quote'];
  if (d.status==='Paid') return ['paid','Paid'];
  if (d.due && d.due < todayISO() && d.status==='Sent') return ['overdue','Overdue'];

}

  const where = (d.site || (d.customer.address||'').split('\n')[0]).trim();
  return `${docTitle(d)}${d.po ? ' – PO ' + d.po : ''} from ${S.business.name}${where ? ' – ' + where : ''}`;
}
function emailBody(d){
  const t = calc(d), b = S.business, isQ = d.kind==='quote';
  const first = (d.customer.name||'').replace(/\(.*?\)/g,'').trim().split(/\s+/)[0] || 'there';
  const L = [`Hi ${first},`, '', isQ ? 'Thank you for having me look at the job. Please find your quote attached.' : 'Thank you for having us. The job is finished. Please find your invoice attached.', ''];
  L.push(docTitle(d));
  if (d.po) L.push(`Purchase order: ${d.po}`);
  d.items.forEach(i => L.push(`• ${(i.desc || 'Job').replace(/\n/g,' ')} — ${money(lineTotal(d,i))}`));
  L.push('', `Total${t.gst ? ' (inc. GST)' : ''}: ${money(t.total)}`);
  if (!isQ){ if (t.paid) L.push(`Already paid: ${money(t.paid)}`); L.push(`Amount due: ${money(t.balance)} by ${fmtDate(d.due)}`); }
  if (!isQ && b.payment) L.push('', 'How to pay:', b.payment);
  L.push('', isQ ? 'Any questions, just call or reply to this email.' : 'Any questions, just call or reply to this email.');
  L.push('', 'Kind regards,', b.name);
  [b.mobile ? 'Mobile ' + b.mobile : '', b.email].filter(Boolean).forEach(x => L.push(x));
  return L.join('\n');
}
function gmailUrl(d){

}

/* ---------- dropdown of people and addresses used before ---------- */
let SUG = [];
function pastCustomers(){
  const m = new Map();
  [...DOCS].sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0)).forEach(d => {
    const n = (d.customer.name||'').trim(); if (!n) return;
    const k = n.toLowerCase(); if (!m.has(k)) m.set(k, { ...d.customer, lastSite: d.site || '' });
  });
  return [...m.values()];
}
function pastAddresses(){
  const m = new Map();
  [...DOCS].sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0)).forEach(d => {
    [d.site, d.customer.address].forEach(a => { a = (a||'').replace(/\s*\n\s*/g, ', ').trim(); if (a && !m.has(a.toLowerCase())) m.set(a.toLowerCase(), { addr:a, who:d.customer.name||'' }); });
  });
  return [...m.values()];
}
function showSugg(kind, q){
  const box = $('#sugg'); if (!box) return;
  q = (q||'').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const hit = t => words.every(w => t.toLowerCase().includes(w));
  if (kind==='name'){
    SUG = q ? pastCustomers().filter(c => hit(c.name) && c.name.toLowerCase() !== q).slice(0,5) : [];
    box.innerHTML = SUG.length ? `<div class="sugg-h">Customers you've had before</div>` + SUG.map((c,i) => `<button data-act="pick-cust" data-i="${i}"><b>${esc(c.name)}</b><span>${esc([c.phone, (c.lastSite || c.address || '').replace(/\n/g,', ')].filter(Boolean).join(' · '))}</span></button>`).join('') : '';
  } else {
    SUG = q.length >= 2 ? pastAddresses().filter(a => hit(a.addr) && a.addr.toLowerCase() !== q).slice(0,5) : [];
    box.innerHTML = SUG.length ? `<div class="sugg-h">Addresses used before</div>` + SUG.map((a,i) => `<button data-act="pick-addr" data-i="${i}"><b>${esc(a.addr)}</b>${a.who ? `<span>${esc(a.who)}</span>` : ''}</button>`).join('') : '';
  }
}
function splitSite(d){
  if (d.siteStreet !== undefined) return;
  const full = (d.site || d.customer.address || '').replace(/\s*\n\s*/g, ', ').trim();
  const m = full.match(/^(.*?),\s*([^,]*\b(VIC|NSW|QLD|SA|WA|TAS|ACT|NT)\b[^,]*)$/i);
  d.siteStreet = m ? m[1] : full; d.siteSuburb = m ? m[2] : '';
}
function joinSite(d){ d.site = [d.siteStreet, d.siteSuburb].map(x => (x||'').trim()).filter(Boolean).join(', '); }
function showSuburbs(q){
  const box = $('#sugg2'); if (!box) return;
  q = (q||'').trim().toLowerCase().replace(/\s+vic\b.*$/,'');
  if (!q || /\b3\d{3}$/.test(q) && SUBURBS.some(x => (x.l+' vic '+x.p) === q)){ box.innerHTML=''; return; }
  const starts = SUBURBS.filter(x => x.l.startsWith(q) || x.p.startsWith(q));
  const inside = q.length > 2 ? SUBURBS.filter(x => !x.l.startsWith(q) && x.l.includes(q)) : [];
  const list = [...starts, ...inside].slice(0, 6);
  box.innerHTML = list.length ? list.map(x => `<button data-act="pick-suburb" data-v="${esc(x.n)} VIC ${x.p}"><b>${esc(x.n)}</b><span>VIC ${x.p}</span></button>`).join('') : `<span class="hint" style="margin:0">Not in the Melbourne list. Just type the suburb and postcode.</span>`;
}
function setPath(o, path, v){ const k = path.split('.'); let t = o; while (k.length > 1) t = t[k.shift()]; t[k[0]] = v; }

$('#app').addEventListener('input', e => {
  const el = e.target;
  if (screen==='step' && el.dataset.f){
    if (el.dataset.f==='paid'){ cur.paid = num(el.value.replace(/[$,\s]/g,'')); const b = $('#baldue'); if (b) b.innerHTML = `Still to pay: <b>${money(calc(cur).balance)}</b>`; return; }
    if (el.dataset.f==='street'){ cur.siteStreet = el.value; joinSite(cur); showSugg('addr', el.value); return; }
    if (el.dataset.f==='suburb'){ cur.siteSuburb = el.value; joinSite(cur); showSuburbs(el.value); return; }
    setPath(cur, el.dataset.f, el.value);
    if (el.dataset.f==='customer.name'){ const n = $('[data-act="next"]'); if (n) n.disabled = !el.value.trim(); showSugg('name', el.value); }
  }
  if (screen==='home' && el.id==='search'){ search = el.value; const pos = el.selectionStart; renderHome(); const s = $('#search'); s.focus(); s.setSelectionRange(pos,pos); }
  if (screen==='settings') settingsInput(el);
});
$('#app').addEventListener('keydown', e => {
  if (screen!=='step' || e.key!=='Enter' || e.shiftKey) return;
  if (e.target.id==='j-desc') return;                 // allow new lines in job text
  if (e.target.id==='j-price'){ e.preventDefault(); addJob(); return; }
  if (e.target.tagName==='TEXTAREA') return;
  e.preventDefault(); const n = $('[data-act="next"]'); if (n && !n.disabled) n.click();
});
function addJob(){
  const desc = $('#j-desc').value.trim(), price = num(($('#j-price').value||'').replace(/[$,\s]/g,''));
  if (!desc && !price){ $('#j-desc').focus(); return false; }
  if (!desc){ toast('Type what the job is.'); $('#j-desc').focus(); return false; }
  if (!price){ toast('Type the price.'); $('#j-price').focus(); return false; }
  cur.items.push({ id:uid(), desc, qty:1, price: (S.gst && cur.applyGst) ? round2(price * 1.1) : price }); renderStep(); $('#j-desc')?.focus(); return true;
}

let setTimer;
function settingsInput(el){
  if (!el.dataset.s) return;

  if (el.type==='number') v = Math.max(0, Math.round(num(v)));
  setPath(S, el.dataset.s, v);
  clearTimeout(setTimer); setTimer = setTimeout(() => store.saveSettings().catch(()=>{}), 500);
}

/* ---------- saving ---------- */
async function saveCur(){
  if (!cur.number){
    cur.number = nextNumber(cur.kind);
    if (cur.kind==='quote') S.nextQuote++; else S.nextInvoice++;
  } else {
    const n = parseInt(cur.number, 10);
    if (cur.kind==='invoice' && n >= S.nextInvoice) S.nextInvoice = n + 1;
    if (cur.kind==='quote' && n >= S.nextQuote) S.nextQuote = n + 1;
  }
  store.saveSettings().catch(()=>{});
  if (!cur.customer.address && cur.site){ /* keep the job address as their address too */ }
  delete cur.siteStreet; delete cur.siteSuburb;
  cur.updatedAt = Date.now();
  const i = DOCS.findIndex(x => x.id===cur.id);
  if (i>=0) DOCS[i] = clone(cur); else DOCS.push(clone(cur));
  try{ await store.saveDoc(cur); }catch(e){ toast('Couldn’t save to your account. Kept on this device.'); }
}
async function deleteDoc(id){
  DOCS = DOCS.filter(x => x.id!==id);
  DOCS.forEach(x => { if (x.invoiceId===id) x.invoiceId=''; });
  try{ await store.deleteDoc(id); }catch(e){}
}

/* ---------- navigation ---------- */
function go(s){
  screen = s; $('#homeLink').hidden = s==='home';
  if (s==='home') renderHome(); else if (s==='step') renderStep(); else if (s==='review') renderReview(); else if (s==='settings') renderSettings();
  window.scrollTo({top:0});
}
function startNew(kind){
  cur = newDoc(kind); cur.inc = true; cur.applyGst = true; stepIdx = 0; go('step');
}
function openDoc(id){ const d = DOCS.find(x => x.id===id); if (!d) return; cur = clone(d); confirmDel = false; go('review'); }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act==='home'){ search=''; go('home'); }
  else if (act==='new') startNew(b.dataset.kind);
  else if (act==='open') openDoc(b.dataset.id);
  else if (act==='settings') go('settings');
  else if (act==='import') $('#importFile').click();
  else if (act==='back'){ if (stepIdx===0) go(cur.number ? 'review' : 'home'); else { stepIdx--; renderStep(); } }
  else if (act==='skip' || act==='next' || act==='nopaid'){
    if (act==='nopaid') cur.paid = 0;
    if (steps(cur)[stepIdx]==='jobs' && act==='next'){
      const d = $('#j-desc')?.value.trim(), p = $('#j-price')?.value.trim();
      if (d || p){ if (!addJob()) return; }
      if (!cur.items.length){ toast('Type the job and the price first.'); $('#j-desc')?.focus(); return; }
    }
    if (steps(cur)[stepIdx]==='address' && !cur.customer.address) cur.customer.address = '';
    if (stepIdx < steps(cur).length - 1){ stepIdx++; renderStep(); if (cur.number) saveCur(); }
    else { await saveCur(); go('review'); toast(`${docTitle(cur)} #${cur.number} saved`); }
  }
  else if (act==='pick-cust'){
    const c = SUG[+b.dataset.i]; if (!c) return;
    cur.customer = { name:c.name||'', phone:c.phone||'', email:c.email||'', address:c.address||'', ...(c.abn ? {abn:c.abn} : {}) };
    if (!cur.site && c.lastSite){ cur.site = c.lastSite; delete cur.siteStreet; }
    stepIdx = steps(cur).indexOf('address'); renderStep(); toast(`Details filled in for ${c.name}`);
  }
  else if (act==='pick-addr'){ const a = SUG[+b.dataset.i]; if (!a) return; cur.site = a.addr; delete cur.siteStreet; splitSite(cur); $('#f-street').value = cur.siteStreet; $('#f-suburb').value = cur.siteSuburb; $('#sugg').innerHTML = ''; joinSite(cur); }
  else if (act==='pick-suburb'){ cur.siteSuburb = b.dataset.v; joinSite(cur); $('#f-suburb').value = b.dataset.v; $('#sugg2').innerHTML = ''; $('[data-act="next"]')?.focus(); }
  else if (act==='pick-icon'){ S.icon = b.dataset.k; paintTopMark(); store.saveSettings().catch(()=>{}); renderSettings(); }
  else if (act==='add-job') addJob();
  else if (act==='rm-job'){ cur.items = cur.items.filter(i => i.id!==b.dataset.id); renderStep(); }
  else if (act==='edit'){ toIncMode(cur); stepIdx = Math.max(0, steps(cur).indexOf(b.dataset.step)); go('step'); }
  else if (act==='download') await download();
  else if (act==='copy') copy(emailBody(cur), 'Message copied. Paste it into Gmail.');
  else if (act==='paid' || act==='unpaid'){ cur.status = act==='paid' ? 'Paid' : 'Sent'; if (act==='paid') cur.paidOn = todayISO(); await saveCur(); renderReview(); toast(act==='paid' ? 'Marked as paid' : 'Marked as not paid'); }
  else if (act==='convert') await convertToInvoice();
  else if (act==='ask-del'){ confirmDel = true; renderReview(); }
  else if (act==='no-del'){ confirmDel = false; renderReview(); }
  else if (act==='del'){ await deleteDoc(cur.id); confirmDel = false; toast('Deleted'); go('home'); }
});
$('#app').addEventListener('click', e => {
  const g = e.target.closest('#gmailBtn');
  if (g && !cur.customer.email){ e.preventDefault(); toast('Add their email first: press Change customer.'); return; }
  if (g && cur.status==='Draft'){ cur.status = 'Sent'; saveCur(); }
});
async function convertToInvoice(){
  const q = cur; toIncMode(q);
  const inv = newDoc('invoice'); inv.inc = true;
  inv.customer = clone(q.customer); inv.site = q.site; inv.po = q.po || '';
  inv.items = clone(q.items).map(i => ({...i, id:uid()}));
  inv.applyGst = q.applyGst; inv.notes = q.notes; inv.fromQuote = q.number;
  q.status = 'Accepted'; q.invoiceId = inv.id; q.updatedAt = Date.now();
  DOCS = DOCS.map(x => x.id===q.id ? clone(q) : x);
  store.saveDoc(q).catch(()=>{});
  cur = inv; stepIdx = steps(inv).indexOf('jobs'); go('step');
  toast('Invoice made from the quote. Change anything that was different, then press Next.');
}
async function download(){
  const btn = $('[data-act="download"]'); if (btn){ btn.disabled = true; btn.firstChild.textContent = 'Making the PDF… '; }
  try{
    if (!cur.number) await saveCur();
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    const data = await makePdf(cur);
    if (dl){ await dl.save({ filename: pdfName(cur), data }); }
    else {
      const file = new File([data], pdfName(cur), { type:'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        try{ await navigator.share({ files:[file] }); }catch(e){ if (e && e.name==='AbortError') return; throw e; }
      } else {
        const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
    }
    toast('PDF saved. Now open Gmail and attach it.');
  }catch(e){
    if (e?.message === 'pdf-lib') toast('The PDF maker didn’t load. Check the internet and try again.');
    else if (!e?.code || !['declined','canceled','cancelled'].includes(e.code)) toast('The PDF didn’t save. Try again.');
  }finally{ const b2 = $('[data-act="download"]'); if (b2){ b2.disabled = false; b2.firstChild.textContent = '1. Save the PDF '; } }
}
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }

/* ---------- import from a PDF or photo ---------- */
async function importFile(file){
  if (!file) return;
  const sample = window.claude?.use ? await window.claude.use('sample') : null;
  if (!sample){ toast('This isn’t available here.'); return; }
  busy = `Reading ${file.name}…`; go('home');
  try{
    let input;
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) input = await pdfToInput(file);
    else if (file.type.startsWith('image/')) input = { text:'', images:[file] };
    else throw {code:'type'};
    if (input.images.length){ const lim = await sample.limits().catch(() => null); if (!lim?.images) throw {code:'images_unavailable'}; }
    const r = await sample.json(IMPORT_PROMPT(input.text), { modelTier:'default', cache:false, ...(input.images.length ? { images: input.images } : {}) });
    const d = newDoc(r.kind === 'quote' ? 'quote' : 'invoice');
    const c = r.customer || {};
    d.customer = { name:String(c.name||''), abn:String(c.abn||''), email:String(c.email||''), phone:String(c.phone||''), address:String(c.address||'').replace(/,\s*(?=[A-Za-z][A-Za-z ]*\s(VIC|NSW|QLD|SA|WA|TAS|ACT|NT)\b[^,]*$)/,'\n') };
    d.site = String(r.site||''); d.po = String(r.po||''); d.notes = String(r.notes||'');
    d.applyGst = r.gst !== false; d.paid = num(r.paid);
    d.items = (Array.isArray(r.items) ? r.items : []).map(i => ({ id:uid(), desc:String(i.desc||''), qty:num(i.qty)||1, unit: UNITS.includes(i.unit) ? i.unit : 'each', rate:num(i.rate) }));
    toIncMode(d);
    const docNo = String(r.number||'').replace(/[^\w-]/g,'');
    if (docNo && !DOCS.some(x => x.kind===d.kind && x.number===docNo)) d.number = docNo;
    d.imported = file.name;
    busy = ''; cur = d; await saveCur(); go('review');
  }catch(e){
    busy = ''; go('home');
    const msg = { pdf_lib:'The PDF reader didn’t load. Check the internet and try again.', type:'Choose a PDF or a photo.',
      images_unavailable:'This PDF is a scan and can’t be read here. Type it in instead.', not_granted:'Allow Claude for this page to read documents.',
      rate_limited:'Too many just now. Wait a minute and try again.', invalid_json:'Couldn’t read that clearly. Try again or type it in.' }[e?.code];
    toast(msg || 'Couldn’t read that. Try again or type it in.');
  }
}
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); });
let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types||[])].includes('Files')){ dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('#drop').hidden = true; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; const f = e.dataTransfer?.files?.[0]; if (f) importFile(f); });

/* ---------- start ---------- */
paintTopMark(); go('home');
store.init().then(async ({settings, docs}) => {
  if (settings) S = Object.assign(defaultSettings(), settings, {business:Object.assign(defaultSettings().business, settings.business||{})});
  DOCS = docs || [];
  // fill in business details from quote #287 where they're still blank or the old placeholder
  let changed = !settings;
  Object.keys(REAL_BUSINESS).forEach(k => { const v = S.business[k]; if (!v || v === OLD_DEFAULTS[k] || v === PREV_BUSINESS[k]){ if (v !== REAL_BUSINESS[k]){ S.business[k] = REAL_BUSINESS[k]; changed = true; } } });
  if (S.business.payment && /BSB:\s*01338(?!\d)/.test(S.business.payment)){ S.business.payment = S.business.payment.replace(/BSB:\s*01338(?!\d)/, 'BSB: 013380'); changed = true; }
  if (S.quoteTerms == null || S.quoteTerms === OLD_DEFAULTS.quoteTerms){ S.quoteTerms = REAL_QUOTE_TERMS; changed = true; }
  if (S.invoiceTerms && /invoice number as your payment reference/i.test(S.invoiceTerms)){ S.invoiceTerms = S.invoiceTerms.replace(/Please use the invoice number as your payment reference\.?/i,'Please use your name as the payment reference.'); changed = true; }
  const PREP = /\s*Includes all necessary prep works[^\n]*?Painting of Buildings\.?/gi;
  for (const x of DOCS){ if (x.notes && /Includes all necessary prep works/i.test(x.notes)){ x.notes = x.notes.replace(PREP,'').replace(/^\s*Terms\s*$/gim,'').trim(); try{ await store.saveDoc(x); }catch(e){} } }
  if (S.quoteTerms && /Includes all necessary prep works/i.test(S.quoteTerms)){ S.quoteTerms = S.quoteTerms.replace(PREP,'').trim(); changed = true; }
  const DEP = /\s*20% deposit required[^\n]*?upon completion of work\.?/gi;
  for (const x of DOCS){ if (x.notes && /20% deposit required/i.test(x.notes)){ x.notes = x.notes.replace(DEP,'').trim(); try{ await store.saveDoc(x); }catch(e){} } if (x.terms && /20% deposit required/i.test(x.terms)){ x.terms = x.terms.replace(DEP,'').trim(); try{ await store.saveDoc(x); }catch(e){} } }
  if (S.quoteTerms && /20% deposit required/i.test(S.quoteTerms)){ S.quoteTerms = S.quoteTerms.replace(DEP,'').trim(); changed = true; }
  if (!S.invoiceTerms || S.invoiceTerms === OLD_DEFAULTS.invoiceTerms){ S.invoiceTerms = REAL_INVOICE_TERMS; changed = true; }
  // one-time import of invoice #2509, and remove the earlier wrong King St import
  S.imported = S.imported || [];
  [SEED_ID,SEED2_ID,SEED3_ID,SEED4_ID,SEED_Q2945,...BATCH_SEEDS.map(b=>b.id)].forEach(id => { if (!S.imported.includes(id)) S.imported.push(id); });
  let seeded = null;
  if (DOCS.find(x => x.id === OLD_SEED_ID)){ DOCS = DOCS.filter(x => x.id !== OLD_SEED_ID); try{ await store.deleteDoc(OLD_SEED_ID); }catch(e){} changed = true; }
  if (!S.imported.includes(SEED_ID) && !DOCS.find(x => x.id === SEED_ID)){
    seeded = seedInvoice(); seeded.updatedAt = Date.now();
    DOCS.push(clone(seeded)); S.imported.push(SEED_ID); changed = true;
    try{ await store.saveDoc(seeded); }catch(e){}
  }
  if (!S.imported.includes(SEED2_ID) && !DOCS.find(x => x.id === SEED2_ID)){
    seeded = seedInvoice2(); seeded.updatedAt = Date.now() + 1;
    DOCS.push(clone(seeded)); S.imported.push(SEED2_ID); changed = true;
    try{ await store.saveDoc(seeded); }catch(e){}
  }
  if (S.nextInvoice < 2511){ S.nextInvoice = 2511; changed = true; }
  for (const oid of OLD_SEED3_IDS){ if (DOCS.find(x => x.id === oid)){ DOCS = DOCS.filter(x => x.id !== oid); try{ await store.deleteDoc(oid); }catch(e){} changed = true; } }
  if (!S.imported.includes(SEED3_ID) && !DOCS.find(x => x.id === SEED3_ID)){
    seeded = seedInvoice3(); seeded.updatedAt = Date.now() + 4;
    DOCS.push(clone(seeded)); S.imported.push(SEED3_ID); changed = true;
    try{ await store.saveDoc(seeded); }catch(e){}
  }
  if (DOCS.find(x => x.id === OLD_SEED4_ID)){ DOCS = DOCS.filter(x => x.id !== OLD_SEED4_ID); try{ await store.deleteDoc(OLD_SEED4_ID); }catch(e){} changed = true; }
  if (!S.imported.includes(SEED4_ID) && !DOCS.find(x => x.id === SEED4_ID)){
    seeded = seedInvoice4(); seeded.updatedAt = Date.now() + 5;
    DOCS.push(clone(seeded)); S.imported.push(SEED4_ID); changed = true;
    try{ await store.saveDoc(seeded); }catch(e){}
  }
  BATCH_SEEDS.forEach((b, i) => {
    if (!S.imported.includes(b.id) && !DOCS.find(x => x.id === b.id)){
      const d = batchSeed(b); d.updatedAt = Date.now() + 10 + i;
      DOCS.push(clone(d)); S.imported.push(b.id); changed = true;
      store.saveDoc(d).catch(()=>{});
    }
  });
  if (S.nextInvoice < 2850){ S.nextInvoice = 2850; changed = true; }
  if (!S.imported.includes(SEED_Q2945) && !DOCS.find(x => x.id === SEED_Q2945)){
    const q = seedQuote2945(); q.updatedAt = Date.now() + 20;
    DOCS.push(clone(q)); S.imported.push(SEED_Q2945); changed = true;
    store.saveDoc(q).catch(()=>{});
  }
  if (S.nextQuote < 288){ S.nextQuote = 288; changed = true; }
  if (changed){ try{ await store.saveSettings(); }catch(e){} }
  delete S.presets; if (!S.icon) S.icon = 'roller'; paintTopMark();
  if (screen==='home') renderHome();
  $('#storeNote').textContent = store.mode==='db' ? 'Saved to your account, so your jobs are here on any device.' : 'Saved on this device only.';
});
